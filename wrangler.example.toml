name = "resend-mcp"
main = "src/worker.ts"
compatibility_date = "2025-06-18"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[vars]
# MCP protocol
MCP_PROTOCOL_VERSION = "2025-11-25"
MCP_TITLE = "Resend"
MCP_VERSION = "1.0.0"

# Auth: require Bearer token for client connections
AUTH_ENABLED = "true"
AUTH_STRATEGY = "bearer"

# Environment
NODE_ENV = "development"

# DO NOT store secrets in [vars]; set via `wrangler secret put`
#
# Required secrets:
#   # Generate a random token for client auth:
#   openssl rand -hex 32
#   wrangler secret put BEARER_TOKEN
#
#   # Resend API key (from resend.com/api-keys):
#   wrangler secret put RESEND_API_KEY
#
#   # From address for emails (required):
#   wrangler secret put RESEND_DEFAULT_FROM
#
#   # Allowed recipients whitelist (optional):
#   # Comma-separated list of emails or @domain patterns.
#   # Leave unset to allow all recipients.
#   # Example: admin@mycompany.com,@trusted-domain.com
#   wrangler secret put RESEND_ALLOWED_RECIPIENTS
